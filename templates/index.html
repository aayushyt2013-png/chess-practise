<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockfish Study Board</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="eyebrow">Local Practice Board</div>
        <h1>Play against <span>Glitch</span></h1>
      </div>
    </header>

    <div class="layout">
      <div class="board-col">
        <div id="board"></div>
      </div>

      <div class="side-col">
        <div class="panel">
          <h2>Position</h2>
          <div class="status-line" id="status">Loading…</div>

          <div class="row">
            <label>You play</label>
            <select id="side">
              <option value="w">White</option>
              <option value="b">Black</option>
            </select>
          </div>

          <div class="row">
            <label>Engine strength — Skill Level <span id="strength-val">10</span>/20</label>
            <input type="range" id="strength" min="0" max="20" value="10">
          </div>

          <div class="row">
            <label>Thinking time — <span id="time-val">0.6</span>s / move</label>
            <input type="range" id="think_time" min="0.1" max="3" step="0.1" value="0.6">
          </div>

          <button class="btn primary" id="newgame">New game</button>
          <button class="btn" id="undo">Undo move</button>
          <button class="btn" id="flip">Flip board</button>

          <h2 style="margin-top:22px;">Moves</h2>
          <div class="scoresheet" id="moves"></div>
        </div>

        <div class="panel">
          <h2>Puzzles</h2>

          <div class="row">
            <label>Paste a PGN or FEN to start from that position</label>
            <textarea id="puzzle-input" rows="4" placeholder="1. e4 e5 2. Nf3 Nc6 3. Bb5 ...&#10;or a FEN"></textarea>
            <button class="btn primary" id="puzzle-load">Load puzzle</button>
          </div>

          <div class="row">
            <label>Save this puzzle's starting position</label>
            <div class="puzzle-save-row">
              <input type="text" id="puzzle-name" placeholder="Puzzle name">
              <button class="btn" id="puzzle-save">Save</button>
            </div>
          </div>

          <div id="puzzle-status"></div>

          <h2 style="margin-top:18px;">Saved puzzles</h2>
          <ul id="puzzle-list"></ul>
        </div>
      </div>
    </div>

    <footer>Engine moves come from a real Stockfish binary running locally via python-chess/UCI. Nothing here connects to any third-party site.</footer>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
